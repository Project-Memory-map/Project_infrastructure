<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu · Bản đồ Ký ức</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/accounts/accounts.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Quên mật khẩu</h1>
    <p class="muted">Nhập email đã đăng ký, chúng tôi sẽ gửi liên kết đặt lại mật khẩu (hiệu lực 30 phút).</p>

    <form class="form" data-endpoint="/api/auth/forgot-password"
          data-success="Nếu email tồn tại, chúng tôi đã gửi hướng dẫn đặt lại mật khẩu">
      <label class="field">Email
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <p class="form-message" hidden></p>
      <button class="button" type="submit">Gửi liên kết</button>
    </form>

    <p class="auth-links"><a href="/accounts/login.html">Quay lại đăng nhập</a></p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/accounts/accounts.js"></script>
</body>
</html>
