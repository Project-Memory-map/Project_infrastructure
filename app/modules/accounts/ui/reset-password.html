<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu · Bản đồ Ký ức</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/accounts/accounts.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Đặt lại mật khẩu</h1>
    <p class="muted">Chọn mật khẩu mới cho tài khoản của bạn.</p>

    <form class="form" data-endpoint="/api/auth/reset-password" data-with-token
          data-success="Đã đặt lại mật khẩu, bạn có thể đăng nhập bằng mật khẩu mới">
      <label class="field">Mật khẩu mới
        <input type="password" name="new_password" minlength="8" autocomplete="new-password"
               pattern="(?=.*[A-Za-z])(?=.*\d).{8,}" title="Ít nhất 8 ký tự gồm chữ và số" required>
      </label>
      <label class="field">Nhập lại mật khẩu mới
        <input type="password" name="password_confirm" autocomplete="new-password" required>
      </label>
      <p class="form-message" hidden></p>
      <button class="button" type="submit">Đặt lại mật khẩu</button>
    </form>

    <p class="auth-links"><a href="/accounts/login.html">Đến trang đăng nhập</a></p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/accounts/accounts.js"></script>
</body>
</html>
