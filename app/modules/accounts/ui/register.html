<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký · Bản đồ Ký ức</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/accounts/accounts.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Tạo tài khoản</h1>
    <p class="muted">Lưu lại từng nơi bạn đã đi qua.</p>

    <form class="form" data-endpoint="/api/auth/register" data-redirect="/">
      <label class="field">Tên hiển thị
        <input type="text" name="display_name" maxlength="100" autocomplete="nickname" required>
      </label>
      <label class="field">Email
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label class="field">Mật khẩu
        <input type="password" name="password" minlength="8" autocomplete="new-password"
               pattern="(?=.*[A-Za-z])(?=.*\d).{8,}" title="Ít nhất 8 ký tự gồm chữ và số" required>
      </label>
      <label class="field">Nhập lại mật khẩu
        <input type="password" name="password_confirm" autocomplete="new-password" required>
      </label>
      <p class="form-message" hidden></p>
      <button class="button" type="submit">Đăng ký</button>
    </form>

    <p class="auth-divider">hoặc</p>
    <div class="social-buttons">
      <a class="icon-button" href="/api/auth/google/login">Đăng ký bằng Google</a>
      <a class="icon-button" href="/api/auth/facebook/login">Đăng ký bằng Facebook</a>
    </div>

    <p class="auth-links">Đã có tài khoản? <a href="/accounts/login.html">Đăng nhập</a></p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/accounts/accounts.js"></script>
</body>
</html>
