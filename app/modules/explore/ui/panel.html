<h2>Khám phá</h2>
<p id="pin-count" class="muted">Đang tải ký ức công khai...</p>
<form id="explore-filter" class="form explore-filter">
  <label class="field">Từ khóa
    <input type="search" name="q" placeholder="Tên địa điểm, tiêu đề...">
  </label>
  <label class="field">Hashtag
    <input type="text" name="hashtags" placeholder="#dalat #phuot">
  </label>
  <label class="field">Khu vực
    <select name="region">
      <option value="">Tất cả tỉnh/thành</option>
    </select>
  </label>
  <button class="button" type="submit">Lọc</button>
</form>
